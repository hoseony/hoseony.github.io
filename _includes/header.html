{% assign current_url = page.url | default: "/" %}
<header class="site-header">
  <a href="/" class="site-brand" aria-label="Hoseon Yu — home">
    <img class="site-brand-image" src="/assets/image2.png" alt="" width="128" height="38">
  </a>

  <nav class="header-tabs" aria-label="Primary navigation">
    <a class="header-tab{% if current_url contains '/projects' %} is-current{% endif %}"
       href="/projects/"{% if current_url contains '/projects' %} aria-current="page"{% endif %}>projects</a>
    <a class="header-tab{% if current_url contains '/notes' %} is-current{% endif %}"
       href="/notes/"{% if current_url contains '/notes' %} aria-current="page"{% endif %}>notes</a>
    <a class="header-tab{% if current_url contains '/blog' %} is-current{% endif %}"
       href="/blog/"{% if current_url contains '/blog' %} aria-current="page"{% endif %}>blog</a>
    <a class="header-tab{% if current_url contains '/about' %} is-current{% endif %}"
       href="/about/"{% if current_url contains '/about' %} aria-current="page"{% endif %}>about</a>
  </nav>

  <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to dark theme" aria-pressed="false">
    <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M20.2 15.2A8.5 8.5 0 0 1 8.8 3.8 8.5 8.5 0 1 0 20.2 15.2Z"></path>
    </svg>
    <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="3.5"></circle>
      <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
    </svg>
  </button>
</header>

<script>
(function () {
  const KEY = "markdown_only_dark_mode";
  const toggle = document.getElementById("theme-toggle");
  const root = document.documentElement;
  if (!toggle) return;

  function apply(mode, persist) {
    const isDark = mode === "dark";
    root.setAttribute("data-color-mode", mode);
    toggle.setAttribute("aria-pressed", String(isDark));
    toggle.setAttribute("aria-label", isDark ? "Switch to light theme" : "Switch to dark theme");
    toggle.title = isDark ? "Switch to light theme" : "Switch to dark theme";
    if (persist) localStorage.setItem(KEY, mode);
  }

  const saved = localStorage.getItem(KEY);
  const initial = saved === "dark" || saved === "light"
    ? saved
    : (root.getAttribute("data-color-mode") === "dark" ? "dark" : "light");
  apply(initial, false);

  toggle.addEventListener("click", function () {
    apply(root.getAttribute("data-color-mode") === "dark" ? "light" : "dark", true);
  });
})();
</script>
